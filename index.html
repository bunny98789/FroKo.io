<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FroKo.io</title>

    <link
        rel="icon"
        type="image/png"
        href="icon.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<h1>FroKo.io</h1>


<!-- ========================================
     CONNECTION
======================================== -->

<div id="connection-panel">

    <input
        type="text"
        id="server-url"
        value="https://multiplayer-test-game-production.up.railway.app"
        placeholder="Server URL"
    >

    <button id="connect-btn">
        Connect to Server
    </button>

    <div id="status">
        Not connected
    </div>

</div>


<!-- ========================================
     GAME HUD
======================================== -->

<div id="hud">

    <div id="health">
        ❤️ 100 HP
    </div>

    <div id="round">
        ROUND 1 / 5
    </div>

    <div id="ammo">
        🔫 6 / 6
    </div>

</div>


<!-- ========================================
     ROOM MENU
======================================== -->

<div id="roomMenu">

    <input
        type="text"
        id="usernameInput"
        placeholder="Username"
        maxlength="16"
    >

    <br><br>

    <button id="createRoomButton">
        Create Room
    </button>

    <br><br>

    <input
        type="text"
        id="roomInput"
        placeholder="Room Code"
        maxlength="8"
    >

    <button id="joinRoomButton">
        Join Room
    </button>

    <p id="roomDisplay"></p>

    <p id="roomError"></p>


    <!-- ====================================
         PLAYER LIST
    ==================================== -->

    <div id="lobbyPlayers">

        <div id="lobbyPlayersTitle">
            PLAYERS
        </div>

        <div id="playerList">
            No players yet.
        </div>

    </div>


    <!-- ====================================
         HOST CONTROLS
    ==================================== -->

    <div id="hostControls">

        <button id="startGameButton">
            ▶ START GAME
        </button>

        <p id="waitingForHost">
            Waiting for host...
        </p>

    </div>

</div>


<!-- ========================================
     ROOM INFO
======================================== -->

<div id="gameRoomInfo">

    Room:
    <span id="gameRoomCode">
        ---
    </span>

</div>


<!-- ========================================
     GAME
======================================== -->

<div id="game-wrapper">

    <canvas
        id="gameCanvas"
        width="600"
        height="400"
    ></canvas>

    <div id="reload">
        RELOADING...
    </div>

</div>


<div id="instructions">

    WASD / Arrow Keys = Move
    &nbsp; | &nbsp;

    Mouse = Aim
    &nbsp; | &nbsp;

    Left Click = Shoot
    &nbsp; | &nbsp;

    R = Reload

</div>


<!-- ========================================
     PAUSE MENU
======================================== -->

<div id="pauseMenu">

    <div id="pauseBox">

        <h2>GAME MENU</h2>

        <button id="colorButton">
            🎨 Change Color
        </button>

        <button id="leaveRoomButton">
            🚪 Leave Room
        </button>

    </div>

</div>


<!-- ========================================
     SOCKET.IO
======================================== -->

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script src="game.js"></script>

</body>

</html>
